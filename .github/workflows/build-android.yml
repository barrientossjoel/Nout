name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Extract App Version
        id: app-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install

      - name: Build Android App via Tauri CLI
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bun run tauri android build --target aarch64 --apk --ci

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk dist-apk/nout-arm64.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nout-arm64
          path: dist-apk/nout-arm64.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.app-version.outputs.tag }}
          name: Release ${{ steps.app-version.outputs.tag }}
          body: |
            ## Nout ${{ steps.app-version.outputs.tag }}
            - Compilación de producción con frontend embebido y auto-actualizador in-app.
            - Compatible con Android 8.0+ (ARM64).
          draft: false
          prerelease: false
          files: dist-apk/nout-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
